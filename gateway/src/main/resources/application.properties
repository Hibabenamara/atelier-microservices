spring.application.name=gateway
server.port=8085

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.routes[0].id=CANDIDAT
#spring.cloud.gateway.server.webmvc.routes[0].uri=http://localhost:8081
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://candidat
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/mic1/**

spring.cloud.gateway.server.webmvc.routes[1].id=CANDIDATURE
#spring.cloud.gateway.server.webmvc.routes[1].uri=http://localhost:8086
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://canditature
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/mic3/**

logging.level.org.springframework.cloud.gateway=DEBUG
logging.level.reactor.netty.http.client=DEBUG
logging.level.org.springframework.cloud.gateway.server.mvc.filter.LoadBalancerFilterFunctions=TRACE
